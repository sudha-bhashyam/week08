name: 00 - Infrastructure

on:
  # Plan + apply automatically when infrastructure code changes on main
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - "monitoring/**"
      - ".github/workflows/00-infrastructure.yml"

  # Plan only for pull requests that change infrastructure
  pull_request:
    paths:
      - "terraform/**"
      - "monitoring/**"

  # Manual run: plan, apply or destroy
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        type: choice
        options:
          - plan
          - apply
          - destroy
        default: plan

permissions:
  contents: read

# Never run two Terraform jobs against the same state at once
concurrency:
  group: terraform-state
  cancel-in-progress: false

env:
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}

jobs:
  # =========================================================
  # Terraform: format check, validate, plan, apply/destroy
  # =========================================================
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          if [ "${{ github.event.inputs.action }}" = "destroy" ]; then
            terraform plan -destroy -input=false -out=tfplan
          else
            terraform plan -input=false -out=tfplan
          fi

      - name: Add plan to job summary
        run: |
          {
            echo "## Terraform plan"
            echo '```'
            terraform show -no-color tfplan | tail -n 80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform Apply
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action != 'plan')
        run: terraform apply -input=false tfplan

  # =========================================================
  # Monitoring: install/upgrade Prometheus + Grafana on AKS
  # =========================================================
  monitoring:
    name: Deploy and validate monitoring
    runs-on: ubuntu-latest
    needs: terraform
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Install or upgrade kube-prometheus-stack
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
            --namespace monitoring --create-namespace \
            -f monitoring/values.yaml \
            --set grafana.adminPassword="${{ secrets.GRAFANA_ADMIN_PASSWORD }}" \
            --wait --timeout 15m

      - name: Apply Grafana dashboards (dashboards as code)
        run: |
          if [ -d monitoring/dashboards ]; then
            kubectl apply -f monitoring/dashboards/
          fi

      - name: Validate Prometheus is collecting metrics
        run: |
          kubectl get pods -n monitoring
          kubectl -n monitoring port-forward svc/prometheus-operated 9090:9090 > /dev/null 2>&1 &
          sleep 15
          UP=$(curl -s "http://localhost:9090/api/v1/targets?state=active" \
                | jq '[.data.activeTargets[] | select(.health=="up")] | length')
          echo "Healthy Prometheus targets: $UP"
          {
            echo "## Monitoring"
            echo "- kube-prometheus-stack installed in namespace \`monitoring\`"
            echo "- Healthy Prometheus scrape targets: **$UP**"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$UP" -lt 1 ]; then
            echo "No healthy Prometheus targets found"
            exit 1
          fi